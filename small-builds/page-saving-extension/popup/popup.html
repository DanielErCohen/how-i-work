<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Second Brain</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <h1>Second Brain</h1>
    <button id="settings-btn" title="Settings" aria-label="Open settings">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </header>

  <main>
    <div id="page-preview">
      <div id="page-title" class="page-title">Loading...</div>
      <span id="source-badge" class="badge">-</span>
    </div>
    <div id="page-type-hint" class="page-type-hint hidden"></div>

    <div class="field">
      <label for="tags">Tags <span class="hint">(optional, comma-separated)</span></label>
      <input type="text" id="tags" placeholder="e.g. startup, growth, saas" autocomplete="off" />
    </div>

    <div class="field">
      <label for="note">Personal note <span class="hint">(optional)</span></label>
      <textarea id="note" placeholder="Your thoughts on this..." rows="3"></textarea>
    </div>

    <div class="screenshot-section">
      <div class="screenshot-header">
        <span class="field-label">Screenshot <span class="hint">(optional)</span></span>
        <div class="screenshot-header-actions">
          <label class="standalone-toggle">
            <input type="checkbox" id="standalone-mode" />
            <span>Screenshot only</span>
          </label>
          <button id="capture-btn" class="capture-btn" title="Capture current tab">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="12" cy="12" r="3"/>
              <path d="M3 9V6a1 1 0 0 1 1-1h3M15 3h3a1 1 0 0 1 1 1v3M21 15v3a1 1 0 0 1-1 1h-3M9 21H6a1 1 0 0 1-1-1v-3"/>
            </svg>
            Capture tab
          </button>
        </div>
      </div>
      <div id="screenshot-drop" class="screenshot-drop" tabindex="0">
        <div id="screenshot-placeholder" class="screenshot-placeholder">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="12" cy="12" r="3"/>
            <path d="M3 9V6a1 1 0 0 1 1-1h3M15 3h3a1 1 0 0 1 1 1v3M21 15v3a1 1 0 0 1-1 1h-3M9 21H6a1 1 0 0 1-1-1v-3"/>
          </svg>
          <span>Paste screenshot here (⌘V)</span>
        </div>
        <div id="screenshot-preview-wrap" class="screenshot-preview-wrap hidden">
          <img id="screenshot-preview" class="screenshot-preview" alt="Screenshot preview" />
          <button id="screenshot-clear" class="screenshot-clear" title="Remove screenshot">✕</button>
        </div>
      </div>
    </div>

    <div id="destinations" class="destinations hidden">
      <div class="destinations-label">Save to <span class="hint">(pick one or more)</span></div>
      <div id="destinations-list" class="destinations-list"></div>
    </div>

    <button id="save-btn" class="save-btn">Save to Second Brain</button>

    <div id="status" class="status hidden"></div>

    <div id="save-links" class="save-links hidden"></div>
  </main>

  <script src="popup.js"></script>
</body>
</html>
